<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Dino Stomp" />
    <meta name="theme-color" content="#bfe3f2" />
    <title>Dino Stomp</title>
    <meta
      name="description"
      content="Pick a dinosaur and stomp through a bright toy town: knock down towers, topple dominoes, and smash castles, farms and forests."
    />

    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- What a shared link shows. %SITE_URL% is filled in at build time (see vite.config.ts). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Dino Stomp" />
    <meta property="og:title" content="Dino Stomp" />
    <meta
      property="og:description"
      content="Pick a dinosaur and stomp through a bright toy town: knock down towers, topple dominoes, and smash castles, farms and forests."
    />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:image" content="%SITE_URL%/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Dino Stomp logo over pictures of Block Town, Sunny Farm and Hogwarts." />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
